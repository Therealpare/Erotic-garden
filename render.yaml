# Render Blueprint for the NestJS API (Render dashboard → New → Blueprint → this repo).
# PostgreSQL lives on Neon and uploaded images on Cloudinary; their credentials, and the
# LINE ones, are secrets marked `sync: false` — Render asks for them when the Blueprint is
# created, and they are never stored in this file.
services:
  - type: web
    name: erotic-garden-api
    runtime: node
    plan: starter # always on; the free plan sleeps after 15 minutes idle
    region: singapore
    rootDir: backend
    # Nest CLI and TypeScript are devDependencies, so include them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # Allowed browser origins (comma-separated). Add a custom domain here when there is one.
      - key: FRONTEND_ORIGIN
        value: https://frontend-seven-gamma-h0tx2fc0w4.vercel.app
      - key: ADMIN_BASE_URL
        value: https://frontend-seven-gamma-h0tx2fc0w4.vercel.app

      # --- Database (Neon) ---
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # Applies pending migrations on every start, so a deploy brings the schema up to date.
      - key: DB_MIGRATIONS_RUN
        value: "true"

      # --- Admin sign-in: random secrets generated by Render ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

      # --- LINE Official Account alerts ---
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false

      # --- Uploaded images (Render's disk is wiped on every deploy) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: erotic-garden
