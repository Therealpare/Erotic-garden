<a [routerLink]="['/art', artwork().slug]" class="group block">
  <div class="relative aspect-[4/5] overflow-hidden bg-cream">
    <div class="h-full w-full transition-transform duration-[700ms] ease-out group-hover:scale-105">
      <app-image-reveal [src]="artwork().coverImageUrl" [alt]="artwork().images.at(0)?.altText ?? artwork().title"></app-image-reveal>
    </div>
    <span
      class="absolute left-4 top-4 bg-ivory/90 px-3 py-1 text-[10px] font-medium uppercase tracking-widest2 text-forest"
    >
      {{ categoryLabel() }}
    </span>
  </div>

  <div class="mt-4 flex items-start justify-between gap-4">
    <div>
      <h3 class="text-2xl">{{ artwork().title }}</h3>
      <p class="mt-1 text-sm text-stone">{{ artwork().location }}</p>
    </div>
    <span
      class="mt-1 shrink-0 text-xs uppercase tracking-widest2 text-terracotta opacity-0 transition-opacity duration-400 group-hover:opacity-100"
    >
      {{ 'cta.view' | translate }}
    </span>
  </div>
</a>
