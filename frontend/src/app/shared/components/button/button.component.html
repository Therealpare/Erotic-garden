<ng-template #label>
  <ng-content></ng-content>
</ng-template>

<ng-container [ngSwitch]="kind()">
  <a
    *ngSwitchCase="'href'"
    [href]="href()"
    class="inline-flex items-center justify-center gap-2 px-6 py-3 text-xs font-medium tracking-widest2 uppercase transition-colors duration-400 {{ variantClasses[variant()] }}"
  >
    <ng-container *ngTemplateOutlet="label"></ng-container>
  </a>

  <a
    *ngSwitchCase="'routerLink'"
    [routerLink]="routerLink()"
    class="inline-flex items-center justify-center gap-2 px-6 py-3 text-xs font-medium tracking-widest2 uppercase transition-colors duration-400 {{ variantClasses[variant()] }}"
  >
    <ng-container *ngTemplateOutlet="label"></ng-container>
  </a>

  <button
    *ngSwitchDefault
    [type]="type()"
    [disabled]="disabled()"
    class="inline-flex items-center justify-center gap-2 px-6 py-3 text-xs font-medium tracking-widest2 uppercase transition-colors duration-400 disabled:opacity-50 disabled:cursor-not-allowed {{ variantClasses[variant()] }}"
  >
    <ng-container *ngTemplateOutlet="label"></ng-container>
  </button>
</ng-container>
