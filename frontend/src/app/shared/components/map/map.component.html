<div *ngIf="hasApiKey(); else noKey" class="aspect-[16/7] w-full overflow-hidden border border-stone/15">
  <iframe
    [src]="embedUrl()"
    [title]="title()"
    class="h-full w-full border-0"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen
  ></iframe>
</div>

<ng-template #noKey>
  <div
    class="flex aspect-[16/7] w-full flex-col items-center justify-center gap-1 border border-dashed border-stone/30 bg-ivory px-6 text-center text-sm text-stone"
  >
    <span>Map will appear here once a Google Maps API key is configured.</span>
    <span class="text-xs text-stone/70">Set googleMapsApiKey in src/environments/environment.ts</span>
  </div>
</ng-template>
