<div class="flex min-h-screen items-center justify-center bg-ivory px-4 py-12">
  <div class="w-full max-w-sm border border-stone/20 bg-white p-8">
    <p class="text-xs font-medium uppercase tracking-widest2 text-terracotta">Erotic Garden &amp; Teahouse</p>
    <h1 class="mt-2 font-display text-3xl text-forest">Admin sign in</h1>

    <p *ngIf="!apiConfigured" class="mt-6 border border-terracotta/30 bg-terracotta/5 p-3 text-sm text-terracotta">
      This build has no API URL configured (environment <code>apiBaseUrl</code>), so sign-in is unavailable.
    </p>
    <p *ngIf="expired" class="mt-6 text-sm text-stone" role="status">Your session expired. Please sign in again.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mt-6 space-y-4">
      <div>
        <label for="admin-email" [class]="labelClass">Email</label>
        <input id="admin-email" type="email" formControlName="email" autocomplete="username" [class]="inputClass" />
      </div>
      <div>
        <label for="admin-password" [class]="labelClass">Password</label>
        <input id="admin-password" type="password" formControlName="password" autocomplete="current-password" [class]="inputClass" />
      </div>

      <p *ngIf="error()" class="text-sm text-terracotta" role="alert">{{ error() }}</p>

      <button
        type="submit"
        [disabled]="loading() || !apiConfigured"
        class="w-full bg-forest px-4 py-3 text-xs font-medium uppercase tracking-widest2 text-ivory transition-colors hover:bg-charcoal disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
