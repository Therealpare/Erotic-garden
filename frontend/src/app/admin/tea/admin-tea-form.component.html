<a routerLink="/admin/tea" class="text-sm text-forest hover:underline">← Back to menu</a>
<h1 class="mt-4 font-display text-3xl text-forest">{{ id === null ? 'Add menu item' : 'Edit menu item' }}</h1>

<p *ngIf="loading()" class="mt-6 text-sm text-stone" role="status">Loading…</p>
<p *ngIf="error() && loading()" class="mt-6 text-sm text-terracotta" role="alert">{{ error() }}</p>

<form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="save()" novalidate class="mt-6 grid max-w-4xl grid-cols-1 gap-5 border border-stone/20 bg-white p-6 sm:grid-cols-2">
  <div>
    <label for="tea-category" [class]="labelClass">Category *</label>
    <select id="tea-category" formControlName="categoryId" [class]="inputClass">
      <option *ngFor="let category of categories()" [ngValue]="category.id">{{ category.name }}</option>
    </select>
  </div>
  <div>
    <label for="tea-status" [class]="labelClass">Availability</label>
    <select id="tea-status" formControlName="status" [class]="inputClass">
      <option *ngFor="let status of statuses" [value]="status">{{ statusLabel[status] }}</option>
    </select>
  </div>

  <div class="sm:col-span-2">
    <app-localized-fields [group]="form.controls.name" label="Name" idPrefix="tea-name" [requiredEn]="true"></app-localized-fields>
  </div>
  <div class="sm:col-span-2">
    <app-localized-fields [group]="form.controls.description" label="Description (optional)" idPrefix="tea-desc" [multiline]="true"></app-localized-fields>
  </div>

  <div class="sm:col-span-2">
    <p [class]="labelClass">Photo (optional)</p>
    <app-image-upload-field [(url)]="imageUrl" label="Menu photo" inputId="tea-image" [allowClear]="true"></app-image-upload-field>
  </div>

  <label class="flex items-center gap-2 text-sm sm:col-span-2">
    <input type="checkbox" formControlName="includedInAdmission" class="h-4 w-4 accent-forest" />
    Included in admission (shown as "Free", no price)
  </label>

  <div *ngIf="!form.controls.includedInAdmission.value">
    <label for="tea-price" [class]="labelClass">Price (THB)</label>
    <input id="tea-price" type="number" min="0" step="0.01" formControlName="price" [class]="inputClass" placeholder="Leave empty to show no price" />
    <p *ngIf="invalid('price')" class="mt-1 text-xs text-terracotta">Price must be 0 or more.</p>
  </div>

  <div>
    <label for="tea-order" [class]="labelClass">Display order</label>
    <input id="tea-order" type="number" min="0" formControlName="sortOrder" [class]="inputClass" />
  </div>

  <div>
    <label for="tea-slug" [class]="labelClass">URL id (slug) *</label>
    <input id="tea-slug" type="text" formControlName="slug" [class]="inputClass" [attr.aria-invalid]="invalid('slug')" />
    <p *ngIf="invalid('slug')" class="mt-1 text-xs text-terracotta">Lowercase letters, numbers and dashes only (e.g. "thai-milk-tea").</p>
  </div>

  <p *ngIf="error() && !loading()" class="text-sm text-terracotta sm:col-span-2" role="alert">{{ error() }}</p>

  <div class="flex gap-3 sm:col-span-2">
    <button type="submit" [disabled]="saving()" class="bg-forest px-5 py-2 text-sm text-ivory hover:bg-charcoal disabled:opacity-50">{{ saving() ? 'Saving…' : 'Save' }}</button>
    <a routerLink="/admin/tea" class="border border-stone/30 px-5 py-2 text-sm hover:bg-cream">Cancel</a>
  </div>
</form>
